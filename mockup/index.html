<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WingLift Dashboard — Prototype</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Clickable prototype of the WingLift business-owner dashboard. Fake data, no backend.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@600;700;800&display=swap">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="proto-banner">
  <strong>Prototype</strong> — clickable mockup with fake data. Nothing here is live.
  <a href="#/home" data-reset>Restart demo</a>
</div>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <a href="#/home" class="brand">
      <svg viewBox="0 0 56 72" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M8 68 C8 68 6 52 18 28 C26 12 36 4 40 2 C40 2 34 8 30 22 C24 42 22 62 22 68 Z" fill="#FFFFFF"/>
        <path d="M18 70 C18 70 20 54 32 32 C40 16 50 8 54 6 C54 6 46 14 42 28 C36 48 34 66 34 70 Z" fill="#4A6CB7"/>
        <path d="M26 72 C26 72 34 60 44 46 C50 38 56 32 56 32 C56 32 50 40 46 50 C40 62 38 72 38 72 Z" fill="#E3A72F"/>
      </svg>
      <span>
        <span class="brand-word">WingLift</span>
        <span class="brand-tag">Get found by AI</span>
      </span>
    </a>

    <div class="biz-switch">
      <div class="biz-avatar">M</div>
      <div>
        <div class="biz-name">Murphy &amp; Sons Plumbing</div>
        <div class="biz-site">murphyplumbing.ie</div>
      </div>
    </div>

    <nav class="side-nav" id="sideNav"></nav>

    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div class="topbar-right">
        <div class="role-switch" role="group" aria-label="View as">
          <span class="role-label">View as</span>
          <button data-role="owner" class="active">Owner</button>
          <button data-role="dev">Developer guest</button>
        </div>
        <a href="#/approvals" class="icon-btn bell owner-only" aria-label="Pending approvals">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="dot-badge" data-badge="approvals"></span>
        </a>
        <div class="user-chip" id="userChip"></div>
      </div>
    </header>

    <main class="content" id="app" tabindex="-1"></main>
  </div>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" id="modalBody"></div>
</div>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
